name: Verify Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          COMPILE_SDK=$(grep '^compileSdk=' gradle.properties | cut -d'=' -f2)
          BUILD_TOOLS=$(grep '^buildToolsVersion=' gradle.properties | cut -d'=' -f2)
          yes | sdkmanager "platform-tools" "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}"

      - name: Verify unit tests and debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-artifacts
          path: |
            app/build/outputs/**/*.apk
            app/build/test-results/**
            app/build/reports/tests/**
          if-no-files-found: warn
