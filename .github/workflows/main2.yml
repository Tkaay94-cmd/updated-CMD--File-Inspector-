name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Install Android SDK
        run: |
          ANDROID_SDK_ROOT="$HOME/Android/Sdk"
          COMPILE_SDK=$(grep '^compileSdk=' gradle.properties | cut -d'=' -f2)
          BUILD_TOOLS="${COMPILE_SDK}.0.0"
          CMDLINE_TOOLS_DIR=$(mktemp -d)
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSLo cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q cmdline.zip -d "$CMDLINE_TOOLS_DIR"
          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          if [ -d "$CMDLINE_TOOLS_DIR/cmdline-tools" ]; then
            mv "$CMDLINE_TOOLS_DIR/cmdline-tools/"* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          else
            mv "$CMDLINE_TOOLS_DIR/"* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          fi
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}"
        env:
          ANDROID_SDK_ROOT: ${{ runner.home }}/Android/Sdk

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          if ! find app/build/outputs/apk -type f -name "*debug*.apk" | grep -q .; then
            echo "No debug APKs were produced for :app."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            app/build/outputs/**/*.apk
          if-no-files-found: error
