name: Build APK

on:
  push:
    branches: [ "skeleton/init" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            **/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'settings.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Install Android SDK (command-line tools + platform/build-tools)
        run: |
          ANDROID_SDK_ROOT="$HOME/Android/Sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSLo cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q cmdline.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest" || true
          elif [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            mv "$ANDROID_SDK_ROOT/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest" || true
          fi
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.0"
          yes | sdkmanager --licenses || true
        env:
          ANDROID_SDK_ROOT: ${{ runner.home }}/Android/Sdk

      - name: Build debug APK (with gradle-wrapper fallback)
        run: |
          set -euo pipefail
          if [ -f ./gradlew ]; then
            echo "Using repository Gradle wrapper"
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "Gradle wrapper not found — installing system Gradle and running 'gradle assembleDebug'"
            sudo apt-get update
            sudo apt-get install -y gradle
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: app/build/outputs/**/*.apk
