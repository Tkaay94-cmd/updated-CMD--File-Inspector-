name: Build and Release APK

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          COMPILE_SDK=$(grep '^compileSdk=' gradle.properties | cut -d'=' -f2)
          BUILD_TOOLS=$(grep '^buildToolsVersion=' gradle.properties | cut -d'=' -f2)
          if [ -z "${COMPILE_SDK}" ]; then
            echo "compileSdk is missing from gradle.properties" >&2
            exit 1
          fi
          yes | sdkmanager --licenses || true
          if [ -n "${BUILD_TOOLS}" ]; then
            sdkmanager "platform-tools" "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}"
          else
            sdkmanager "platform-tools" "platforms;android-${COMPILE_SDK}"
          fi

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug -Dorg.gradle.project.android.useAndroidX=true -Dorg.gradle.project.android.enableJetifier=true --no-daemon --stacktrace
          find app/build/outputs/apk -type f -name "*.apk" | sort > built_apks_list.txt
          if ! [ -s built_apks_list.txt ]; then
            echo "No APKs were produced for :app."
            exit 1
          fi
          cat built_apks_list.txt

      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            built_apks_list.txt
            app/build/outputs/**/*.apk
          if-no-files-found: error

      - name: Publish release with APK
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          body: Automated CI build for ${{ github.sha }}
          files: |
            app/build/outputs/**/*.apk
