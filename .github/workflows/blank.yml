name: Build and Release APK

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          COMPILE_SDK=$(grep '^compileSdk=' gradle.properties | cut -d'=' -f2)
          BUILD_TOOLS=$(grep '^buildToolsVersion=' gradle.properties | cut -d'=' -f2)
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}"

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug -Dorg.gradle.project.android.useAndroidX=true -Dorg.gradle.project.android.enableJetifier=true --no-daemon --stacktrace
          find app/build/outputs/apk -type f -name "*.apk" | sort > built_apks_list.txt
          if ! [ -s built_apks_list.txt ]; then
            echo "No APKs were produced for :app."
            exit 1
          fi
          cat built_apks_list.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            built_apks_list.txt
            app/build/outputs/**/*.apk
          if-no-files-found: error

      - name: Compute release metadata
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag_name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            if [ -n "${{ github.event.release.name }}" ]; then
              echo "release_name=${{ github.event.release.name }}" >> "$GITHUB_OUTPUT"
            else
              echo "release_name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tag_name=thirdparty-inspector-${{ github.run_number }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
            echo "release_name=Thirdparty Inspector APK - Run ${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body: Automated CI build for ${{ github.sha }}
          files: |
            app/build/outputs/**/*.apk
