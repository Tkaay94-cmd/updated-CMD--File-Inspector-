name: JVM Unit Tests

on:
  push:
    branches: [ "skeleton/init" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Discover and run unit tests
        run: |
          if [ -f ./gradlew ]; then
            # Dump tasks for debugging
            ./gradlew :app:tasks --all --console=plain > tasks.txt || true
            echo "--- Available tasks (truncated) ---"
            head -n 200 tasks.txt || true

            # Try common unit test tasks in order
            if grep -q "testDebugUnitTest" tasks.txt; then
              echo "Running :app:testDebugUnitTest"
              ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
            elif grep -q "\:app\:test\b" tasks.txt || grep -q "\:app:tasks" tasks.txt; then
              echo "Running :app:test"
              ./gradlew :app:test --no-daemon --stacktrace
            else
              # Try a generic test invocation as a last resort
              echo "No specific unit test task detected for :app. Attempting 'test' at root (may fail)."
              ./gradlew test --no-daemon --stacktrace || true
              echo "No recognized unit test tasks found; CI will continue but no tests were executed. See tasks.txt for available tasks."
            fi
          else
            echo "Gradle wrapper not found; skipping tests"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: |
            app/build/test-results/**
            app/build/reports/tests/**
