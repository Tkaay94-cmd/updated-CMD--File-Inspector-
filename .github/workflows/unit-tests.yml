name: JVM Unit Tests

on:
  push:
    branches: [ "skeleton/init" ]
  pull_request:
    branches: [ "main" ]

env:
  JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF8"

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'settings.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Install Android SDK (commandline tools + platforms/build-tools)
        # Install SDK components to support Android Gradle plugin if needed
        run: |
          ANDROID_SDK_ROOT="$HOME/Android/Sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSLo cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q cmdline.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          # move into 'latest' folder expected by tools
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest" || true
          elif [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            mv "$ANDROID_SDK_ROOT/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest" || true
          fi
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.0"
          yes | sdkmanager --licenses || true
        env:
          ANDROID_SDK_ROOT: ${{ runner.home }}/Android/Sdk

      - name: Discover modules and run unit tests
        run: |
          set -euo pipefail
          echo "Discovering modules with build.gradle(.kts)..."
          MODULE_DIRS=$(find . -maxdepth 2 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -printf '%h\n' | sort -u | grep -v '^\.$' || true)
          if [ -z "$MODULE_DIRS" ]; then
            echo "No modules with build.gradle found. Attempting root tasks list."
            ./gradlew tasks --all --console=plain > root_tasks.txt || true
            head -n 200 root_tasks.txt || true
            echo "No module-level build files discovered; skipping module test runs."
            exit 0
          fi

          for dir in $MODULE_DIRS; do
            module=":${dir#./}"
            echo "\n=== Module: $module (path: $dir) ==="
            # Dump tasks for the module for debugging
            ./gradlew "$module:tasks" --all --console=plain > "$dir/tasks.txt" || true
            echo "--- tasks for $module (truncated) ---"
            head -n 200 "$dir/tasks.txt" || true

            # Try common unit test tasks in order
            if grep -q "testDebugUnitTest" "$dir/tasks.txt"; then
              echo "Running $module:testDebugUnitTest"
              ./gradlew "$module:testDebugUnitTest" --no-daemon --stacktrace || true
            elif grep -q "\btest\b" "$dir/tasks.txt"; then
              echo "Running $module:test"
              ./gradlew "$module:test" --no-daemon --stacktrace || true
            else
              echo "No recognized unit test tasks found for $module; skipping."
            fi
          done

      - name: Upload test results and task lists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: |
            **/tasks.txt
            **/build/test-results/**
            **/build/reports/tests/**
            build/reports/problems/**
